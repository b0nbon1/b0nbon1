baseurl = "https://bonvic.dev"
languageCode = "en-us"
title = "Bonvic Bundi"
theme = "bon"
ignoreFiles = ["\\.Rmd$", "\\.Rmarkdown$", "_files$", "_cache$"]
footnotereturnlinkcontents = "↩"
pluralizeListTitles = false
enableGitInfo = true

[permalinks]
posts = "blog/:slug/"

[params]
about = "Software engineer. Mostly doing backend work with Python."
meta = "Bonvic's blog. | Software engineer. Mostly doing fullstack work with Typescript and Golang."
author = "Bonvic Bundi"
authorTitle = "Software Engineer"
numberOfPostsInHomePage = 5
lastUpdated = "October 31th, 2025"

[params.utterances]
repo = "b0nbon1/b0nbon1"  # Replace with your GitHub username/repo (e.g., "b0nbon1/blog-comments")
issueTerm = "pathname"     # Options: pathname, url, title, og:title
label = "💬 comment"       # Label for GitHub issues
theme = "github-light"     # Options: github-light, github-dark, preferred-color-scheme, github-dark-orange, icy-dark, dark-blue, photon-dark

[[menus.main]]
[[menus.main]]
name = 'Blog'
pageRef = '/blog'
weight = 1

[[menus.main]]
name = 'Reading'
pageRef = '/reading'
weight = 2

[[menus.main]]
name = 'Watching'
pageRef = '/watching'
weight = 3

[[menus.socials]]
name = "Github"
url = "https://github.com/b0nbon1"
weight = 1

[[menus.socials]]
name = "LinkedIn"
url = "https://www.linkedin.com/in/bonvic-bundi/"
weight = 2

[[menus.socials]]
name = "Email"
url = "mailto:bundi.bonvic@gmail.com"
weight = 3

[[menus.footer]]
name = 'Github'
url = "https://github.com/b0nbon1"
weight = 1

[[menus.footer]]
name = 'LinkedIn'
url = "https://www.linkedin.com/in/bonvic-bundi/"
weight = 2

[[menus.footer]]
name = 'Email'
url = "mailto:bundi.bonvic@gmail.com"
weight = 3

[module]
[[module.mounts]]
    source = 'assets'
    target = 'assets'
[[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'
[module.hugoVersion]
extended = false
min = "0.116.0"

[markup]
[markup.highlight]
style = "monokai"
lineNos = false
lineNumbersInTable = false
noClasses = false
tabWidth = 2
guessSyntax = true
[markup.goldmark.renderer]
unsafe = true

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'
  
