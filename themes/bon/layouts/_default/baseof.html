<!doctype html>
<html lang="{{ or site.Language.LanguageCode site.Language.Lang }}"
  dir="{{ or site.Language.LanguageDirection `ltr` }}">

<head>
  {{ partial "head.html" . }}
</head>

<body class="bg-background text-foreground relative font-sans selection:text-[#160404] selection:bg-[#fef4ad] w-full transition-colors duration-200">
  <div class="container mx-auto" style="max-width: 785px;">
    <header class="mt-8 mb-24 px-4 md:px-0">
      {{ partial "header.html" . }}
    </header>
    <main class="px-4 md:px-1">{{ block "main" . }}{{ end }}</main>
    <footer class="text-sm text-center mt-20 mb-8 px-4 md:px-0">
      {{ partial "footer.html" . }}
    </footer>
  </div>
</body>

</html>
